services:
  db:
    image: postgres:16-alpine
    container_name: projekat-turnir-db
    environment:
      POSTGRES_PASSWORD: ${SIFRA:-postgres}
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: projekat-turnir-app
    ports:
      - "8000:8000"
    environment:
      SIFRA: ${SIFRA:-postgres}
      TAJNI_KLJUC: ${TAJNI_KLJUC}
      DB_HOST: db
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
