<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rakani Open 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root { --tamna: #0f2a43; --zuta: #e9a521; }
    html, body { margin: 0; height: 100%; background: #1e6fb5; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("/static/pocetna.jpg");
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    @media (orientation: portrait) {
      body::before { background-image: url("/static/telefon.jpg"); }
    }

    .stranica {
      box-sizing: border-box;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: calc(env(safe-area-inset-top, 0px) + 5vh) 5vw
               calc(env(safe-area-inset-bottom, 0px) + 5vh);
      position: relative;
      z-index: 1;
    }

    .traka {
      position: relative;
      display: inline-block;
      isolation: isolate;
      padding: 0.3em 1.2em;
      text-transform: uppercase;
    }
    .traka::before {
      content: "";
      position: absolute;
      inset: 0 -0.3em;
      background: var(--boja);
      filter: url(#kist);
      z-index: -1;
    }

    .naslov {
      --boja: #fff;
      color: var(--tamna);
      font-family: "Anton", Impact, sans-serif;
      font-size: clamp(2rem, 7.5vw, 4.8rem);
      transform: rotate(-2deg);
    }
    .podnaslov {
      --boja: var(--zuta);
      color: var(--tamna);
      font-family: "Permanent Marker", cursive;
      font-size: clamp(1rem, 3.4vw, 2.1rem);
      transform: rotate(-1.5deg);
      margin-top: -0.2em;
    }
    .uskoro {
      --boja: var(--tamna);
      color: var(--zuta);
      font-family: "Anton", Impact, sans-serif;
      font-size: clamp(1.5rem, 5vw, 3rem);
      transform: rotate(-1deg);
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="kist" x="-10%" y="-40%" width="120%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.13" numOctaves="3" seed="4" result="sum"/>
      <feDisplacementMap in="SourceGraphic" in2="sum" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main class="stranica">
    <header>
      <div class="traka naslov">Rakani Open 2027</div><br>
      <div class="traka podnaslov">Turnir u odbojci na pijesku</div>
    </header>
    <div class="traka uskoro">Coming soon...</div>
  </main>
</body>
</html>
